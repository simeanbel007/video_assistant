<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>视频助手</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <!-- 顶部状态栏 -->
    <div class="header">
      <span class="led" id="led"></span>
      <span class="title">视频助手</span>
    </div>

    <!-- 状态信息 -->
    <div class="status-section">
      <div class="status-row">
        <span class="label">状态：</span>
        <span class="value" id="statusText">未检测到视频</span>
      </div>
      <div class="status-row" id="videoInfoRow" style="display:none">
        <span class="label">视频：</span>
        <span class="value video-title" id="videoTitle"></span>
      </div>
    </div>

    <!-- 主开关 -->
    <div class="toggle-section">
      <span class="toggle-label">自动连播</span>
      <label class="switch">
        <input type="checkbox" id="autoToggle">
        <span class="slider"></span>
      </label>
      <span class="toggle-state" id="toggleState">关</span>
    </div>

    <!-- 统计信息 -->
    <div class="stats-section">
      <div class="stat-row">
        <span class="stat-label">已自动切换</span>
        <span class="stat-value" id="switchCount">0</span>
        <span class="stat-unit">个视频</span>
      </div>
      <div class="stat-row" id="nextChapterRow" style="display:none">
        <span class="stat-label">下一节：</span>
        <span class="stat-value stat-next" id="nextChapter">--</span>
      </div>
    </div>

    <!-- 功能状态 -->
    <div class="feature-section">
      <div class="feature-row" id="disguiseFeature">
        <span class="check-icon" id="disguiseIcon">○</span>
        <span class="feature-text">前台伪装</span>
        <span class="feature-status" id="disguiseStatus">未激活</span>
      </div>
      <div class="feature-row" id="behaviorFeature">
        <span class="check-icon" id="behaviorIcon">○</span>
        <span class="feature-text">行为仿真</span>
        <span class="feature-status" id="behaviorStatus">未激活</span>
      </div>
    </div>

    <!-- 警告条 -->
    <div class="warning" id="warningBar" style="display:none">
      <span class="warn-icon">⚠️</span>
      <span class="warn-text">检测到验证弹窗，请手动处理</span>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
